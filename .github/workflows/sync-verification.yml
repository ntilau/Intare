name: Sync Script Verification

on:
  push:
    paths:
      - 'sync.sh'
      - '.github/workflows/sync-verification.yml'
  pull_request:
    paths:
      - 'sync.sh'

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Make sync.sh executable
      run: chmod +x sync.sh

    - name: Check script syntax
      run: bash -n sync.sh

    - name: Verify script help/usage
      run: ./sync.sh --help 2>&1 || true

    - name: Verify script structure
      run: |
        grep -q "ADB first" sync.sh && echo "ADB-first logic found"
        grep -q "SMB fallback" sync.sh && echo "SMB fallback logic found"
        grep -q "FOLDER_NAME" sync.sh && echo "Parameterized folder name found"
        grep -q "BASE_DIR" sync.sh && echo "Parameterized base directory found"

    - name: Test ADB unavailable path (simulate)
      run: |
        # Temporarily rename adb to simulate it not being found
        if command -v adb >/dev/null; then
          sudo mv $(which adb) $(which adb).hidden 2>/dev/null || true
        fi
        ./sync.sh Documents /tmp/test-sync 2>&1 | head -20 || true
        # Restore adb if we moved it
        if [ -f $(which adb).hidden ]; then
          sudo mv $(which adb).hidden $(which adb) || true
        fi

    - name: Cleanup test directory
      run: rm -rf /tmp/test-sync