name: Release

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v2.0.1

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating releases
      packages: write  # for uploading artifacts

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Configure project
      run: ./configure

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease

    - name: Zipalign APK
      id: zipalign
      run: |
        BT="$ANDROID_HOME/build-tools/34.0.0"
        "$BT/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

    - name: Sign APK
      id: sign
      run: |
        set -a
        # Load keystore properties from secrets
        echo "storeFile=$KEYSTORE_PATH" >> $GITHUB_ENV
        echo "storePassword=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
        echo "keyAlias=$KEY_ALIAS" >> $GITHUB_ENV
        echo "keyPassword=$KEY_PASSWORD" >> $GITHUB_ENV
        set +a

        BT="$ANDROID_HOME/build-tools/34.0.0"
        "$BT/apksigner" sign \
          --ks "$KEYSTORE_PATH" \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --key-pass pass:"$KEY_PASSWORD" \
          --out app/build/outputs/apk/release/Intare-v${GITHUB_REF#refs/tags/v}.apk \
          app-release-aligned.apk

    - name: Verify Signed APK
      run: |
        BT="$ANDROID_HOME/build-tools/34.0.0"
        "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/Intare-v${GITHUB_REF#refs/tags/v}.apk

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: Intare v${GITHUB_REF#refs/tags/v}
        generate_release_notes: true
        files: app/build/outputs/apk/release/Intare-v${GITHUB_REF#refs/tags/v}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}